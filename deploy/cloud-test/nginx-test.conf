# Reference only. The deployment scripts do not copy or reload Nginx.
# Verify the active server configuration and certificate paths before any use.
server {
    listen 80;
    server_name test.yunshecun.com test-admin.yunshecun.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name test.yunshecun.com test-admin.yunshecun.com;

    ssl_certificate /etc/letsencrypt/live/test.yunshecun.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.yunshecun.com/privkey.pem;

    client_max_body_size 500m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
