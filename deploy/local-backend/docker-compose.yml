services:
  backend:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-22-bookworm
    container_name: yunshecun-backend-local
    working_dir: /app
    env_file:
      - ../../code/backend/.env
    environment:
      DATABASE_URL: file:/app/prisma-data/dev.db
      WECHAT_PAY_PRIVATE_KEY_PATH: /app/certs/apiclient_key.pem
      WECHAT_PAY_CERT_PATH: /app/certs/apiclient_cert.pem
    ports:
      - "3000:3000"
    volumes:
      - ../../code/backend:/src:ro
      - ../../code/证书:/app/certs:ro
      - yunshecun_backend_app:/app
      - yunshecun_backend_db:/app/prisma-data
      - yunshecun_backend_uploads:/app/uploads
    entrypoint:
      - sh
      - -lc
      - |
        find /app -mindepth 1 -maxdepth 1 ! -name uploads ! -name certs ! -name prisma-data -exec rm -rf {} + &&
        tar --exclude='./node_modules' --exclude='./uploads' --exclude='./prisma/dev.db' -C /src -cf - . | tar -C /app -xf - &&
        npm ci &&
        npx prisma generate &&
        exec "$@"
      - --
    command: ["node", "server.js"]
    restart: unless-stopped

volumes:
  yunshecun_backend_app:
  yunshecun_backend_db:
  yunshecun_backend_uploads:
